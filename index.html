<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxia amarilla ✨</title>
<style>
:root{--gold:#ffd21a;--yellow:#fff36a;--amber:#ff9d00;--ink:#030306}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:Georgia,serif}
#app{position:relative;width:100vw;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#2a1c05 0%,#0a0804 25%,#020205 70%)}
#space{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.42) 100%);z-index:2}
.header{position:absolute;z-index:5;top:4.5%;left:50%;width:94%;transform:translateX(-50%);text-align:center;pointer-events:none}
h1{margin:0;color:#fffbd1;font-size:clamp(2.25rem,9vw,5.4rem);font-style:italic;letter-spacing:.03em;text-shadow:0 0 5px #fff,0 0 16px var(--yellow),0 0 42px var(--amber)}
.header p{margin:.45rem 0 0;color:#ffe86a;font-family:Arial,sans-serif;font-size:clamp(.63rem,1.8vw,1rem);letter-spacing:.28em;text-transform:uppercase;text-shadow:0 0 14px var(--gold)}
.core{position:absolute;z-index:3;top:42%;left:50%;width:clamp(88px,16vw,145px);height:clamp(88px,16vw,145px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fffde1 0 4%,#ffe844 13%,#ffae00 34%,rgba(255,126,0,.3) 55%,transparent 72%);filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 28px #ffd000);animation:pulse 3.8s ease-in-out infinite}
.core:after{position:absolute;content:'♥';inset:0;display:grid;place-items:center;color:#fffbd0;font-size:clamp(3rem,8vw,6rem);text-shadow:0 0 9px #fff,0 0 25px #ffe000;animation:heart 3.8s ease-in-out infinite}
@keyframes pulse{50%{scale:1.12;filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 45px #ffb000)}}@keyframes heart{50%{scale:1.12}}
.orbit{position:absolute;z-index:2;top:42%;left:50%;width:min(78vw,570px);height:min(35vw,250px);border:1px solid rgba(255,215,34,.72);border-radius:50%;transform:translate(-50%,-50%) rotateX(65deg);box-shadow:0 0 12px #ffce22,0 0 36px rgba(255,165,0,.3);animation:orbit 13s linear infinite}
.orbit:before,.orbit:after{position:absolute;inset:8%;border:1px solid rgba(255,234,94,.25);border-radius:50%;content:''}.orbit:after{inset:-15%;opacity:.35}@keyframes orbit{to{rotate:360deg}}
.flower{position:absolute;z-index:6;width:clamp(46px,7vw,76px);height:clamp(46px,7vw,76px);padding:0;border:0;background:transparent;cursor:pointer;transform:translate(-50%,-50%);filter:drop-shadow(0 0 5px #fff500) drop-shadow(0 0 16px #ffad00);animation:sway var(--duration) ease-in-out infinite;transition:filter .25s,scale .25s}
.flower:hover,.flower:focus{z-index:8;scale:1.32;outline:0;filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 30px #ffe500)}
.flower .petals{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 5deg,#fff798 0 11deg,#ffcf19 11deg 22deg);mask:radial-gradient(circle,transparent 0 23%,#000 24%)}
.flower .petals:after{position:absolute;inset:5%;border-radius:50%;background:repeating-conic-gradient(from 14deg,#ffed65 0 12deg,#efa900 12deg 24deg);content:'';mask:radial-gradient(circle,transparent 0 28%,#000 29%)}
.flower .center{position:absolute;inset:28%;border-radius:50%;background:radial-gradient(circle at 34% 27%,#c98719 0 6%,#5c2f05 43%,#211004 100%);box-shadow:0 0 8px #ffb300}
.flower .center:after{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,#ffc928 0 10%,transparent 11%);background-size:6px 6px;content:'';opacity:.65}
@keyframes sway{0%,100%{margin-top:0;rotate:-3deg}50%{margin-top:-12px;rotate:5deg}}
.caption{position:absolute;z-index:4;color:#ffed70;font:700 clamp(.56rem,1.45vw,.92rem)/1 'Courier New',monospace;letter-spacing:.08em;white-space:nowrap;text-shadow:0 0 5px #fff000,0 0 15px #ff9d00;pointer-events:none;animation:twinkle 3s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.45}}
.message{position:absolute;z-index:12;left:50%;top:66%;width:min(88%,540px);padding:22px 25px;border:1px solid #ffeb64;border-radius:20px;background:rgba(9,7,2,.92);box-shadow:0 0 14px #ffd000,0 0 45px rgba(255,142,0,.35),inset 0 0 20px rgba(255,210,0,.12);text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.82);transition:.45s ease}.message.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}.message strong{display:block;margin-bottom:8px;color:#fff9bd;font-size:1.35rem;text-shadow:0 0 12px #ffd000}.message p{margin:0;color:#fff1a0;font-size:clamp(1rem,2.8vw,1.35rem);line-height:1.45}.message small{display:block;margin-top:12px;color:#c6a437;font:11px Arial,sans-serif}.hint{position:absolute;z-index:5;bottom:20px;left:50%;width:90%;color:#c5a52c;font:11px Arial,sans-serif;letter-spacing:.12em;text-align:center;text-transform:uppercase;text-shadow:0 0 9px #ffb700;transform:translateX(-50%)}
@media(max-width:600px){.header{top:5%}.core{top:40%}.orbit{top:40%;width:92vw;height:43vw}.message{top:70%}.caption{font-size:8px}.hint{bottom:13px}}
</style>
</head>
<body>
<main id="app">
<canvas id="space"></canvas><div class="vignette"></div>
<header class="header"><h1>Te Amo</h1><p>Flores amarillas para ti ✨</p></header>
<div class="core"></div><div class="orbit"></div>
<div id="message" class="message"><strong>🌻 Para ti</strong><p id="messageText"></p><small>Pulsa otra flor para descubrir otro mensaje</small></div>
<div class="hint">Pulsa una flor para descubrir una frase especial</div>
</main>
<script>
const app=document.querySelector('#app'),canvas=document.querySelector('#space'),ctx=canvas.getContext('2d'),message=document.querySelector('#message'),messageText=document.querySelector('#messageText');
const phrases=['Tu sonrisa ilumina mis días más que cualquier estrella.','Eres mi lugar favorito en todo el universo.','Contigo, hasta los momentos sencillos se vuelven mágicos.','Tu forma de querer hace florecer mi corazón.','Si pudiera elegir de nuevo, volvería a encontrarte.','Mi mundo se siente más bonito cuando estás tú.','Tu ternura es mi refugio favorito.','Cada pensamiento bonito termina llevándome hasta ti.','No necesito pedir un deseo; ya te tengo a ti.','Eres ese rayito de luz que siempre estaba esperando.','Me gustas en todos los tiempos, lugares y universos.','Tu existencia es mi coincidencia favorita.'];
const labels=['MI AMOR','TE AMO','MI VIDA','SIEMPRE TÚ','MI CIELO','FELIZ DÍA','MI ESTRELLA','CON AMOR','ERES ESPECIAL','MI TODO','PARA TI'];
const positions=[[8,69],[19,57],[30,75],[40,61],[57,62],[69,54],[81,70],[92,59],[15,85],[35,87],[63,82],[84,86]];let w,h,dpr,stars=[],timeout;
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(1700,Math.max(550,w*h/650))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.65+.15,a:Math.random()*.8+.2,s:Math.random()*.3+.04,p:Math.random()*7}));buildFlowers()}
function buildFlowers(){document.querySelectorAll('.flower,.caption').forEach(e=>e.remove());positions.forEach(([x,y],i)=>{let f=document.createElement('button');f.className='flower';f.type='button';f.setAttribute('aria-label','Abrir frase de la flor');f.style.left=x+'%';f.style.top=y+'%';f.style.setProperty('--duration',3.4+Math.random()*2.4+'s');f.style.animationDelay=Math.random()*-4+'s';f.innerHTML='<span class="petals"></span><span class="center"></span>';f.onclick=()=>showPhrase(phrases[i]);app.appendChild(f);if(i<labels.length){let c=document.createElement('span');c.className='caption';c.textContent=labels[i];c.style.left=Math.max(2,x-8)+'%';c.style.top=y+5+'%';c.style.transform='rotate('+(Math.random()*12-6)+'deg)';c.style.animationDelay=Math.random()*-3+'s';app.appendChild(c)}})}
function showPhrase(value){messageText.textContent=value;message.classList.add('visible');clearTimeout(timeout);timeout=setTimeout(()=>message.classList.remove('visible'),6500)}
function draw(t){ctx.clearRect(0,0,w,h);for(const s of stars){s.y-=s.s;if(s.y<-4){s.y=h+4;s.x=Math.random()*w}ctx.globalAlpha=s.a*(.55+Math.sin(t*.002+s.p)*.35);ctx.fillStyle=s.r>1.3?'#fffbd0':(Math.random()>.55?'#ffc928':'#9d711a');ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script>
</body>
</html>
