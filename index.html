<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Te amo · Galaxia amarilla</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020204;color:#fff;font-family:Georgia,serif}.scene{position:relative;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#291d06,#090804 28%,#020204 72%)}canvas{position:absolute;inset:0;width:100%;height:100%}.title{position:absolute;z-index:2;top:5%;left:50%;width:95%;text-align:center;transform:translateX(-50%);pointer-events:none}.title h1{margin:0;color:#fffbd0;font-size:clamp(2.3rem,10vw,5.8rem);font-style:italic;text-shadow:0 0 5px #fff,0 0 17px #ffe600,0 0 40px #ff8c00}.title p{margin:6px;color:#ffe65b;font:clamp(.65rem,1.8vw,1rem) Arial;letter-spacing:.28em;text-transform:uppercase;text-shadow:0 0 13px #ffb900}.tip{position:absolute;bottom:17px;z-index:2;left:50%;width:92%;transform:translateX(-50%);color:#cda932;font:11px Arial;letter-spacing:.12em;text-align:center;text-transform:uppercase}.card{position:absolute;z-index:8;top:70%;left:50%;width:min(88%,510px);padding:21px 24px;border:1px solid #ffea62;border-radius:20px;background:#080602ed;box-shadow:0 0 14px #ffd000,0 0 42px #ff8c0066;text-align:center;opacity:0;transform:translate(-50%,-50%) scale(.8);transition:.45s;pointer-events:none}.card.open{opacity:1;transform:translate(-50%,-50%) scale(1)}.card b{display:block;color:#fff8bd;font-size:1.35rem;text-shadow:0 0 10px #ffd000}.card p{margin:9px 0 0;color:#fff0a0;font-size:clamp(1rem,2.8vw,1.32rem);line-height:1.42}.card small{display:block;margin-top:11px;color:#b99735;font:10px Arial}.flower{position:absolute;z-index:5;width:clamp(45px,7vw,76px);height:clamp(45px,7vw,76px);padding:0;border:0;background:transparent;transform:translate(-50%,-50%);cursor:pointer;filter:drop-shadow(0 0 5px #fff500) drop-shadow(0 0 16px #ffad00);animation:sway var(--duration) ease-in-out infinite;transition:.25s}.flower:hover{z-index:9;scale:1.3;filter:drop-shadow(0 0 8px white) drop-shadow(0 0 30px #ffe500)}.flower:before{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#fff797 0 11deg,#ffca18 11deg 22deg);mask:radial-gradient(circle,transparent 0 23%,#000 24%);content:""}.flower:after{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 35% 25%,#c98515,#371b03 72%);box-shadow:0 0 8px #ffb300;content:""}@keyframes sway{50%{margin-top:-12px;rotate:5deg}}@media(max-width:600px){.card{top:72%}}</style></head><body><main class="scene"><canvas id="space"></canvas><header class="title"><h1>Te Amo</h1><p>Flores amarillas para ti ✨</p></header><div id="card" class="card"><b>🌻 Para ti</b><p id="phrase"></p><small>pulsa otra flor para descubrir otro mensaje</small></div><div class="tip">pulsa una flor · cada una guarda un mensaje único</div></main><script>const c=document.querySelector('#space'),x=c.getContext('2d'),scene=document.querySelector('.scene'),card=document.querySelector('#card'),phrase=document.querySelector('#phrase');let W,H,D,stars=[],dust=[],flowers=[],timer;const words=['MI AMOR','TE AMO','MI VIDA','SIEMPRE TÚ','MI CIELO','FELIZ DÍA','MI ESTRELLA','CON AMOR','ERES ESPECIAL','MI TODO','PARA TI'];const messages=['Tu sonrisa ilumina mis días más que cualquier estrella.','Eres mi lugar favorito en todo el universo.','Contigo, hasta los momentos sencillos se vuelven mágicos.','Tu forma de querer hace florecer mi corazón.','Si pudiera elegir de nuevo, volvería a encontrarte.','Mi mundo se siente más bonito cuando estás tú.','Tu ternura es mi refugio favorito.','Cada pensamiento bonito termina llevándome hasta ti.','No necesito pedir un deseo; ya te tengo a ti.','Eres ese rayito de luz que siempre estaba esperando.','Me gustas en todos los tiempos, lugares y universos.','Tu existencia es mi coincidencia favorita.'];function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);stars=Array.from({length:Math.min(1800,Math.max(600,W*H/550))},()=>({x:Math.random()*W,y:Math.random()*H,r:.2+Math.random()*1.5,a:.2+Math.random()*.8,p:Math.random()*7}));dust=Array.from({length:Math.min(1800,Math.max(600,W*H/600))},()=>({a:Math.random()*7,r:Math.pow(Math.random(),.7)*Math.min(W,H)*.48,arm:Math.floor(Math.random()*5),z:Math.random()}));makeFlowers()}function makeFlowers(){document.querySelectorAll('.flower,.caption').forEach(e=>e.remove());[[9,68],[20,57],[31,74],[42,62],[58,62],[69,54],[81,70],[92,59],[16,84],[36,86],[63,82],[84,85]].forEach((p,i)=>{let f=document.createElement('button');f.className='flower';f.style.left=p[0]+'%';f.style.top=p[1]+'%';f.style.setProperty('--duration',3.5+Math.random()*2+'s');f.style.animationDelay=Math.random()*-4+'s';f.onclick=()=>{phrase.textContent=messages[i];card.classList.add('open');clearTimeout(timer);timer=setTimeout(()=>card.classList.remove('open'),6500)};scene.appendChild(f);let q=document.createElement('span');q.className='caption';q.textContent=words[i%words.length];q.style.cssText=`position:absolute;z-index:3;left:${Math.max(2,p[0]-8)}%;top:${p[1]+5}%;color:#ffed70;font:bold clamp(8px,1.3vw,15px) Courier New;text-shadow:0 0 6px #fff000,0 0 15px #f90;pointer-events:none`;scene.appendChild(q)})}function glow(a,b,r,col){let g=x.createRadialGradient(a,b,0,a,b,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(a-r,b-r,r*2,r*2)}function draw(t){x.clearRect(0,0,W,H);for(let s of stars){s.y-=.04;if(s.y<0)s.y=H;x.globalAlpha=s.a*(.55+.45*Math.sin(t*.002+s.p));x.fillStyle=s.r>1.2?'#fffbd0':'#d69c15';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}let cx=W/2,cy=H*.48,base=Math.min(W,H),rot=t*.00004;glow(cx,cy,base*.45,'rgba(255,183,0,.08)');x.globalCompositeOperation='lighter';for(let p of dust){let a=p.arm*1.257+p.r*.018+(Math.random()-.5)*.4+rot*(1-p.r/base),xx=cx+Math.cos(a)*p.r*1.25,yy=cy+Math.sin(a)*p.r*.4;x.globalAlpha=(1-p.r/(base*.65))*.65;x.fillStyle=p.z>.5?'#ffe34c':'#a86c08';x.beginPath();x.arc(xx,yy,.4+p.z*1.8,0,7);x.fill()}x.globalCompositeOperation='source-over';x.globalAlpha=1;x.save();x.translate(cx,cy);x.rotate(rot);x.scale(1,.38);x.strokeStyle='#ffdc3b99';x.shadowColor='#ffc400';x.shadowBlur=12;x.beginPath();x.arc(0,0,base*.32,0,7);x.stroke();x.beginPath();x.arc(0,0,base*.43,0,7);x.stroke();x.restore();let hx=cx,hy=H*.31,sc=base*.006;for(let i=0;i<700;i++){let a=Math.random()*7,r=Math.random(),px=16*Math.sin(a)**3,py=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));x.globalAlpha=.2+Math.random()*.7;x.fillStyle=i%4?'#ffdf13':'#fff8a0';x.beginPath();x.arc(hx+px*sc*(.65+r*.35),hy+py*sc*(.65+r*.35),.3+Math.random()*1.5,0,7);x.fill()}x.globalAlpha=1;glow(hx,hy,base*.17,'rgba(255,204,0,.1)');requestAnimationFrame(draw)}addEventListener('resize',resize);resize();requestAnimationFrame(draw)</script></body></html>
