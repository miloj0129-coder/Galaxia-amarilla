<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxia amarilla ✨</title>
  <style>
    :root {
      --bg: #03050a;
      --panel: rgba(15, 14, 26, 0.5);
      --violet: #9a7dff;
      --violet-soft: #d7c8ff;
      --gold: #ffd84d;
      --gold-2: #ffc400;
      --gold-3: #ffb000;
      --text: #f1f2ff;
      --muted: #c7c5ea;
      --card: rgba(14, 12, 18, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      background:
        radial-gradient(circle at center, rgba(221, 183, 63, 0.08), transparent 20%),
        radial-gradient(circle at center, rgba(99, 74, 255, 0.10), transparent 38%),
        #03050a;
    }

    canvas:active {
      cursor: grabbing;
    }

    .interface {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 26px;
      left: 30px;
      text-shadow: 0 0 18px rgba(255, 192, 0, 0.8);
      pointer-events: none;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.4vw, 3.2rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff8cf;
    }

    .title p {
      margin: 8px 0 0;
      color: #d7d3f9;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.88;
    }

    .panel {
      position: absolute;
      right: 24px;
      bottom: 22px;
      width: 230px;
      padding: 18px 16px 14px;
      border: 1px solid rgba(255, 216, 77, 0.25);
      border-radius: 18px;
      background: rgba(16, 12, 26, 0.55);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(255, 182, 0, 0.14);
      pointer-events: auto;
    }

    .panel label {
      display: block;
      margin: 12px 0 6px;
      color: #eae7ff;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #f5be0f;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 212, 75, 0.5);
      border-radius: 10px;
      background: linear-gradient(135deg, #f7d53d, #d79d00);
      color: #1b1202;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 180, 0, 0.25);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .hint {
      position: absolute;
      left: 30px;
      bottom: 28px;
      font-size: 0.8rem;
      color: #d1cfe9;
      opacity: 0.9;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .info {
      position: absolute;
      top: 24px;
      right: 26px;
      min-width: 180px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(12, 10, 20, 0.55);
      border: 1px solid rgba(255, 220, 80, 0.22);
      color: #f4ebff;
      opacity: 0;
      transform: translateY(-8px);
      transition: 0.25s ease;
      pointer-events: none;
    }

    .info.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card {
      position: absolute;
      left: 50%;
      top: 68%;
      transform: translate(-50%, -50%) scale(0.82);
      width: min(90%, 520px);
      padding: 18px 20px 16px;
      border: 1px solid rgba(255, 214, 85, 0.7);
      border-radius: 18px;
      background: rgba(17, 12, 16, 0.82);
      box-shadow:
        0 0 18px rgba(255, 212, 65, 0.22),
        inset 0 0 20px rgba(255, 200, 0, 0.08);
      opacity: 0;
      transition: 0.35s ease;
      pointer-events: none;
      z-index: 6;
      text-align: center;
    }

    .card.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .card b {
      display: block;
      margin-bottom: 10px;
      color: #fff5bd;
      font-size: clamp(1.2rem, 2.8vw, 1.7rem);
      text-shadow: 0 0 10px rgba(255, 210, 80, 0.9);
    }

    .card p {
      margin: 0;
      color: #fff3b6;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      line-height: 1.5;
    }

    .card small {
      display: block;
      margin-top: 10px;
      color: #d1b85a;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .flower {
      position: absolute;
      z-index: 5;
      width: 46px;
      height: 46px;
      border: none;
      background: transparent;
      cursor: pointer;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      filter: drop-shadow(0 0 8px rgba(255, 213, 70, 0.8)) drop-shadow(0 0 16px rgba(255, 174, 0, 0.8));
      animation: sway var(--dur) ease-in-out infinite;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .flower:hover {
      transform: translate(-50%, -50%) scale(1.25);
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255, 203, 0, 0.95));
    }

    .flower::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-conic-gradient(from 8deg, #fff9b4 0deg 12deg, #ffca18 12deg 23deg);
      mask: radial-gradient(circle, transparent 0 23%, #000 24%);
      -webkit-mask: radial-gradient(circle, transparent 0 23%, #000 24%);
    }

    .flower::after {
      content: "";
      position: absolute;
      inset: 28%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #d58a00 0 12%, #462502 55%, #140d05 100%);
      box-shadow: 0 0 8px rgba(255, 194, 0, 0.9);
    }

    @keyframes sway {
      0%, 100% {
        transform: translate(-50%, -50%) rotate(-4deg) scale(1);
      }
      50% {
        transform: translate(-50%, -50%) rotate(5deg) scale(1.05);
      }
    }

    .tag {
      position: absolute;
      z-index: 4;
      color: #ffe978;
      font: 700 0.72rem "Courier New", monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 193, 0, 0.9);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0.88;
    }

    @media (max-width: 700px) {
      .title {
        top: 18px;
        left: 18px;
      }

      .hint {
        display: none;
      }

      .panel {
        width: 200px;
        right: 14px;
        bottom: 14px;
      }

      .card {
        top: 70%;
      }
    }
  </style>
</head>
<body>
  <canvas id="galaxy"></canvas>

  <div class="interface">
    <div class="title">
      <h1>Te Amo</h1>
      <p>Galaxia dorada</p>
    </div>

    <div id="info" class="info">Estrella seleccionada</div>

    <div class="hint">
      Arrastra para rotar · rueda para acercar
    </div>

    <div class="panel">
      <label for="speed">Velocidad</label>
      <input id="speed" type="range" min="0.1" max="2.0" step="0.01" value="0.65" />

      <label for="density">Densidad</label>
      <input id="density" type="range" min="0.6" max="2.4" step="0.1" value="1.2" />

      <button id="pause">Pausar</button>
    </div>
  </div>

  <div id="card" class="card">
    <b>🌻 Para ti</b>
    <p id="messageText">Tu sonrisa ilumina todo lo que hay alrededor.</p>
    <small>Galaxia de amor</small>
  </div>

  <script>
    const canvas = document.getElementById("galaxy");
    const ctx = canvas.getContext("2d");
    const speedControl = document.getElementById("speed");
    const densityControl = document.getElementById("density");
    const pauseBtn = document.getElementById("pause");
    const info = document.getElementById("info");
    const card = document.getElementById("card");
    const messageText = document.getElementById("messageText");

    let width = 0;
    let height = 0;
    let centerX = 0;
    let centerY = 0;
    let stars = [];
    let rotation = 0;
    let animationRotation = 0;
    let zoom = 1;
    let speed = 0.65;
    let paused = false;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let tilt = 0.56;

    const flowerMessages = [
      "Tu sonrisa ilumina mis días más que cualquier estrella.",
      "Eres mi lugar favorito en todo el universo.",
      "Contigo, hasta los momentos sencillos se vuelven mágicos.",
      "Tu forma de querer hace florecer mi corazón.",
      "No necesito pedir un deseo; ya te tengo a ti.",
      "Mi mundo se siente más bonito cuando estás tú.",
      "Tu ternura es mi refugio favorito.",
      "Cada pensamiento bonito termina llevándome hasta ti.",
      "Eres ese rayito de luz que siempre estaba esperando.",
      "Me gustas en todos los tiempos, lugares y universos.",
      "Tu existencia es mi coincidencia favorita.",
      "Si pudiera elegir de nuevo, volvería a encontrarte."
    ];

    const flowerLabels = ["MI AMOR", "TE AMO", "MI VIDA", "MI CIELO", "FELIZ DÍA", "MI TODO", "MI ESTRELLA", "CON AMOR", "ERES ESPECIAL", "PARA TI", "SIEMPRE TÚ", "MI CORAZÓN"];
    const positions = [
      [9, 68], [20, 57], [31, 74], [42, 62], [58, 62],
      [69, 54], [81, 70], [92, 59], [16, 84], [36, 86],
      [63, 82], [84, 86]
    ];

    let flowerData = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * devicePixelRatio;
      canvas.height = height * devicePixelRatio;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      centerX = width / 2;
      centerY = height / 2;

      buildStars();
      buildFlowers();
    }

    function buildStars() {
      const total = Math.min(2500, Math.max(900, Math.floor((width * height) / 10))) * Number(densityControl.value);
      stars = [];

      for (let i = 0; i < total; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.pow(Math.random(), 0.65) * Math.min(width, height) * 0.72;
        const hue = Math.random();

        stars.push({
          angle,
          dist,
          radius: Math.random() * 1.6 + 0.3,
          alpha: Math.random() * 0.9 + 0.2,
          color: hue > 0.75 ? "#fff0bb" : hue > 0.5 ? "#b9d8ff" : "#d7b8ff",
          glow: Math.random() > 0.78 ? 1 : 0
        });
      }
    }

    function buildFlowers() {
      document.querySelectorAll(".flower, .tag").forEach((el) => el.remove());
      flowerData = [];

      positions.forEach(([x, y], i) => {
        const flower = document.createElement("button");
        flower.className = "flower";
        flower.type = "button";
        flower.style.left = x + "%";
        flower.style.top = y + "%";
        flower.style.setProperty("--dur", (3.2 + Math.random() * 2.3) + "s");
        flower.style.animationDelay = (Math.random() * -4) + "s";
        flower.title = flowerMessages[i % flowerMessages.length];
        flower.addEventListener("click", () => {
          showMessage(flowerMessages[i % flowerMessages.length]);
        });

        document.body.appendChild(flower);

        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = flowerLabels[i % flowerLabels.length];
        tag.style.left = (x - 5) + "%";
        tag.style.top = (y + 5) + "%";
        document.body.appendChild(tag);

        flowerData.push({
          x: (x / 100) * width,
          y: (y / 100) * height,
          message: flowerMessages[i % flowerMessages.length],
          phase: Math.random() * Math.PI * 2
        });
      });
    }

    function showMessage(text) {
      messageText.textContent = text;
      card.classList.add("visible");
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => {
        card.classList.remove("visible");
      }, 6000);
    }

    function drawBackground() {
      const bg = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, Math.max(width, height) * 0.8);
      bg.addColorStop(0, "rgba(40, 25, 0, 0.4)");
      bg.addColorStop(0.2, "rgba(25, 20, 40, 0.7)");
      bg.addColorStop(0.6, "#070a13");
      bg.addColorStop(1, "#02040a");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);
    }

    function drawGalaxy() {
      const centerGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.min(width, height) * 0.40);
      centerGlow.addColorStop(0, "rgba(255, 245, 170, 0.96)");
      centerGlow.addColorStop(0.1, "rgba(255, 198, 50, 0.92)");
      centerGlow.addColorStop(0.35, "rgba(255, 146, 0, 0.22)");
      centerGlow.addColorStop(1, "rgba(255, 0, 0, 0)");
      ctx.fillStyle = centerGlow;
      ctx.fillRect(centerX - Math.min(width, height) * 0.4, centerY - Math.min(width, height) * 0.4, Math.min(width, height) * 0.8, Math.min(width, height) * 0.8);

      for (const star of stars) {
        const a = star.angle + animationRotation * (1.3 - star.dist / (Math.min(width, height) * 0.72));
        const r = star.dist * zoom * 0.9;
        const x = centerX + Math.cos(a) * r;
        const y = centerY + Math.sin(a) * r * tilt;

        if (x < -20 || x > width + 20 || y < -20 || y > height + 20) continue;

        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = star.color;

        if (star.glow) {
          ctx.beginPath();
          ctx.arc(x, y, star.radius * 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(x, y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawCoreHalo() {
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotation * 0.15);

      const ring = ctx.createRadialGradient(0, 0, 20, 0, 0, Math.min(width, height) * 0.38);
      ring.addColorStop(0, "rgba(255, 248, 170, 0.7)");
      ring.addColorStop(0.18, "rgba(255, 196, 0, 0.38)");
      ring.addColorStop(0.5, "rgba(255, 158, 0, 0.1)");
      ring.addColorStop(1, "rgba(255, 0, 0, 0)");
      ctx.fillStyle = ring;
      ctx.beginPath();
      ctx.arc(0, 0, Math.min(width, height) * 0.38, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255, 216, 77, 0.5)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.min(width, height) * 0.22, Math.min(width, height) * 0.12, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function drawFlowers() {
      const pulse = performance.now() * 0.0015;

      for (let i = 0; i < flowerData.length; i++) {
        const f = flowerData[i];
        const x = f.x + Math.sin(pulse + f.phase) * 8;
        const y = f.y + Math.cos(pulse * 1.2 + f.phase) * 8;

        const visible = document.querySelectorAll(".flower")[i];
        if (visible) {
          visible.style.left = (x / width) * 100 + "%";
          visible.style.top = (y / height) * 100 + "%";
          visible.style.transform = "translate(-50%, -50%)";
        }

        const tag = document.querySelectorAll(".tag")[i];
        if (tag) {
          tag.style.left = ((x / width) * 100 - 5) + "%";
          tag.style.top = ((y / height) * 100 + 4) + "%";
        }
      }
    }

    function animate() {
      drawBackground();

      if (!paused) {
        rotation += speed * 0.006;
        animationRotation += speed * 0.005;
      }

      drawGalaxy();
      drawCoreHalo();
      drawFlowers();

      requestAnimationFrame(animate);
    }

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;

      rotation += dx * 0.006;
      tilt = Math.max(0.32, Math.min(0.9, tilt + dy * 0.0012));

      lastX = e.clientX;
      lastY = e.clientY;
    });

    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointerleave", () => { dragging = false; });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom *= e.deltaY > 0 ? 0.92 : 1.08;
      zoom = Math.max(0.62, Math.min(1.9, zoom));
    }, { passive: false });

    speedControl.addEventListener("input", () => {
      speed = Number(speedControl.value);
    });

    densityControl.addEventListener("input", () => {
      buildStars();
    });

    pauseBtn.addEventListener("click", () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "Reanudar" : "Pausar";
    });

    info.textContent = "Galaxia cálida";
    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
