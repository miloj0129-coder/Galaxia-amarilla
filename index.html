<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia amarilla ✨</title>
  <style>
    :root{--yellow:#ffe84a;--gold:#ffad00;--cream:#fff6b0}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020203;color:#fff;font-family:Georgia,serif}
    #app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#211700 0%,#080702 27%,#020203 70%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .top{position:absolute;z-index:3;top:5%;left:50%;width:92%;text-align:center;transform:translateX(-50%);pointer-events:none}
    h1{margin:0;color:var(--cream);font-size:clamp(2.3rem,9vw,5.5rem);font-style:italic;text-shadow:0 0 7px #fff,0 0 18px var(--yellow),0 0 42px #f70}
    .top p{margin:.4rem 0;color:#ffe66b;font:clamp(.65rem,2vw,1rem) Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;text-shadow:0 0 12px var(--gold)}
    .heart{position:absolute;z-index:2;top:25%;left:50%;width:88px;height:88px;background:linear-gradient(135deg,#fffca4,#ffc400 60%,#f47700);transform:translateX(-50%) rotate(-45deg);filter:drop-shadow(0 0 6px #fff700) drop-shadow(0 0 28px #ff9d00);animation:float 4s ease-in-out infinite}
    .heart:before,.heart:after{position:absolute;width:88px;height:88px;border-radius:50%;background:inherit;content:""}.heart:before{top:-44px}.heart:after{left:44px}
    .ring{position:absolute;top:43%;left:50%;z-index:1;width:min(68vw,470px);height:min(68vw,470px);border:2px solid #ffcf2866;border-radius:50%;transform:translate(-50%,-50%) rotateX(65deg);box-shadow:0 0 15px #ffc400,0 0 38px #ff9d0066;animation:spin 14s linear infinite}
    .ring:after{position:absolute;inset:8%;border:1px solid #ffe95c66;border-radius:50%;content:""}
    @keyframes float{50%{margin-top:-14px;transform:translateX(-50%) rotate(-45deg) scale(1.08)}}@keyframes spin{to{transform:translate(-50%,-50%) rotateX(65deg) rotateZ(360deg)}}
    .flower{position:absolute;z-index:4;width:58px;height:58px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;transform:translate(-50%,-50%);filter:drop-shadow(0 0 5px #fff000) drop-shadow(0 0 15px #ffae00);animation:sway var(--duration) ease-in-out infinite;transition:scale .25s,filter .25s}
    .flower:before{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,#4b2300 0 19%,transparent 20%),repeating-conic-gradient(#fff36a 0 13deg,#f9c500 13deg 25deg);content:""}
    .flower:after{position:absolute;inset:21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bd7800,#351a03 75%);box-shadow:0 0 8px #ffb300;content:""}
    .flower:hover,.flower:focus{scale:1.3;outline:none;filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 30px #ffea00)}
    @keyframes sway{50%{margin-top:-12px;rotate:5deg}}
    .label{position:absolute;z-index:2;color:#ffef72;font:clamp(.58rem,1.5vw,1rem) 'Courier New',monospace;font-weight:bold;letter-spacing:.08em;text-shadow:0 0 5px #fff700,0 0 14px #ffae00;white-space:nowrap;animation:glow 3s ease-in-out infinite alternate;pointer-events:none}
    @keyframes glow{to{opacity:.55;text-shadow:0 0 3px #fff700}}
    .message{position:absolute;top:68%;left:50%;z-index:8;width:min(88%,530px);padding:22px 25px;border:1px solid #ffe642aa;border-radius:18px;background:#0d0a02eb;color:#fff3a0;text-align:center;box-shadow:0 0 14px #ffd000,0 0 38px #ff9d0066;opacity:0;transform:translate(-50%,-50%) scale(.82);transition:.45s;pointer-events:none}.message.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}.message strong{display:block;margin-bottom:8px;color:#fff8bc;font-size:1.35rem;text-shadow:0 0 10px #ffd000}.message p{margin:0;font-size:clamp(1rem,2.8vw,1.35rem);line-height:1.45}.message small{display:block;margin-top:11px;color:#c8a83c;font: .7rem Arial,sans-serif}.hint{position:absolute;bottom:22px;left:50%;z-index:5;width:90%;color:#c6a92f;font: .75rem Arial,sans-serif;letter-spacing:.08em;text-align:center;text-transform:uppercase;text-shadow:0 0 8px #ffb700;transform:translateX(-50%)}
    @media(max-width:600px){.heart{top:25%;scale:.72}.ring{top:42%;width:82vw;height:82vw}.flower{scale:.8}.label{font-size:.56rem}.message{top:70%}}
  </style>
</head>
<body>
  <main id="app"><canvas id="stars"></canvas><header class="top"><h1>Te Amo</h1><p>Flores amarillas para ti</p></header><div class="heart"></div><div class="ring"></div><div id="message" class="message"><strong>🌻 Para ti</strong><p id="text"></p><small>Pulsa otra flor para descubrir otro mensaje</small></div><div class="hint">Pulsa una flor para descubrir una frase especial</div></main>
  <script>
    const app=document.querySelector('#app'),canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d'),box=document.querySelector('#message'),text=document.querySelector('#text');let w,h,dpr,particles=[],timer;
    const phrases=['Tu sonrisa ilumina mis días más que cualquier estrella.','Eres mi lugar favorito en todo el universo.','Contigo, hasta los momentos sencillos se vuelven mágicos.','Tu forma de querer hace florecer mi corazón.','Si pudiera elegir de nuevo, volvería a encontrarte.','Mi mundo se siente más bonito cuando estás tú.','Tu ternura es mi refugio favorito.','Cada pensamiento bonito termina llevándome hasta ti.','No necesito pedir un deseo; ya te tengo a ti.','Eres ese rayito de luz que siempre estaba esperando.','Me gustas en todos los tiempos, lugares y universos.','Tu existencia es mi coincidencia favorita.'];
    const labels=['MI AMOR','TE AMO','MI VIDA','SIEMPRE TÚ','MI CIELO','FELIZ DÍA','MI ESTRELLA','CON AMOR','ERES ESPECIAL','MI TODO','PARA TI'];
    function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.min(1400,Math.max(350,w*h/850))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.2,s:Math.random()*.35+.05,p:Math.random()*7,b:Math.random()*.8+.2}));makeFlowers()}
    function makeFlowers(){document.querySelectorAll('.flower,.label').forEach(e=>e.remove());const pos=[[8,68],[20,57],[30,74],[40,61],[57,62],[69,54],[81,70],[92,59],[15,84],[35,87],[62,82],[83,86]];pos.forEach((p,i)=>{const f=document.createElement('button');f.className='flower';f.type='button';f.setAttribute('aria-label','Leer frase de la flor');f.style.left=p[0]+'%';f.style.top=p[1]+'%';f.style.setProperty('--duration',3.5+Math.random()*2.5+'s');f.style.animationDelay=Math.random()*-4+'s';f.onclick=()=>show(phrases[i]);app.appendChild(f);if(i<labels.length){const l=document.createElement('span');l.className='label';l.textContent=labels[i];l.style.left=Math.max(2,p[0]-8)+'%';l.style.top=p[1]+5+'%';l.style.transform=`rotate(${Math.random()*12-6}deg)`;app.appendChild(l)}})}
    function show(value){text.textContent=value;box.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>box.classList.remove('visible'),6500)}
    function animate(t){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.y-=p.s;if(p.y<0){p.y=h;p.x=Math.random()*w}ctx.globalAlpha=p.b*(.55+Math.sin(t*.002+p.p)*.35);ctx.fillStyle=Math.random()>.88?'#fffbd0':'#e6ad20';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;requestAnimationFrame(animate)}
    addEventListener('resize',resize);resize();requestAnimationFrame(animate);
  </script>
</body>
</html>
