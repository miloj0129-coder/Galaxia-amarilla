<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Te amo · Galaxia amarilla</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020204}body{font-family:Georgia,serif;color:#fff}.scene{position:relative;width:100vw;height:100svh;overflow:hidden;background:#020204}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 62%,rgba(255,184,0,.12),transparent 35%),radial-gradient(ellipse at 50% 35%,rgba(55,30,0,.25),transparent 50%);pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%}.title{position:absolute;z-index:2;top:5%;left:50%;width:95%;transform:translateX(-50%);text-align:center;pointer-events:none}.title h1{margin:0;color:#fff9cb;font-size:clamp(2.3rem,10vw,5.8rem);font-style:italic;letter-spacing:.04em;text-shadow:0 0 5px #fff,0 0 16px #ffe700,0 0 38px #ff9c00}.title p{margin:6px 0;color:#ffe65b;font:clamp(.65rem,1.8vw,1rem) Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;text-shadow:0 0 13px #ffb900}.tip{position:absolute;z-index:2;bottom:18px;left:50%;width:92%;transform:translateX(-50%);color:#cda932;font:11px Arial,sans-serif;letter-spacing:.12em;text-align:center;text-transform:uppercase;text-shadow:0 0 8px #ffb500}.card{position:absolute;z-index:5;left:50%;top:72%;width:min(88%,500px);padding:21px 24px;border:1px solid rgba(255,230,74,.85);border-radius:20px;background:rgba(8,6,2,.94);box-shadow:0 0 13px #ffd000,0 0 42px rgba(255,140,0,.42),inset 0 0 20px rgba(255,212,0,.12);text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.8);transition:.45s ease}.card.open{opacity:1;transform:translate(-50%,-50%) scale(1)}.card b{display:block;color:#fff8bd;font-size:1.3rem;text-shadow:0 0 10px #ffd000}.card p{margin:9px 0 0;color:#fff0a0;font-size:clamp(1rem,2.8vw,1.32rem);line-height:1.42}.card small{display:block;margin-top:11px;color:#b99735;font:10px Arial,sans-serif}
</style>
</head>
<body><main class="scene"><canvas id="canvas"></canvas><header class="title"><h1>Te Amo</h1><p>Flores amarillas para ti ✨</p></header><div id="card" class="card"><b>🌻 Para ti</b><p id="phrase"></p><small>pulsa otra flor para descubrir otro mensaje</small></div><div class="tip">pulsa una flor · cada una guarda un mensaje único</div></main>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),card=document.querySelector('#card'),phrase=document.querySelector('#phrase');let W,H,D,stars=[],dust=[],flowers=[],t0=0,closeTimer;
const messages=['Tu sonrisa ilumina mis días más que cualquier estrella.','Eres mi lugar favorito en todo el universo.','Contigo, hasta los momentos sencillos se vuelven mágicos.','Tu forma de querer hace florecer mi corazón.','Si pudiera elegir de nuevo, volvería a encontrarte.','Mi mundo se siente más bonito cuando estás tú.','Tu ternura es mi refugio favorito.','Cada pensamiento bonito termina llevándome hasta ti.','No necesito pedir un deseo; ya te tengo a ti.','Eres ese rayito de luz que siempre estaba esperando.','Me gustas en todos los tiempos, lugares y universos.','Tu existencia es mi coincidencia favorita.'];
const words=['MI AMOR','TE AMO','MI VIDA','SIEMPRE TÚ','MI CIELO','FELIZ DÍA','MI ESTRELLA','CON AMOR','ERES ESPECIAL','MI TODO','PARA TI'];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);makeWorld()}
function makeWorld(){let n=Math.min(2100,Math.max(700,W*H/500));stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:.15+Math.random()*1.4,a:.18+Math.random()*.8,p:Math.random()*7,s:.01+Math.random()*.08}));dust=Array.from({length:Math.min(1700,Math.max(500,W*H/650))},()=>{let a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.7)*Math.min(W,H)*.48;return {a,r,arm:Math.floor(Math.random()*5),s:.4+Math.random()*2,radius:.3+Math.random()*1.7,alpha:.25+Math.random()*.7}});flowers=[];let pos=[[.09,.67],[.2,.57],[.31,.73],[.42,.62],[.58,.62],[.69,.54],[.81,.69],[.92,.59],[.16,.84],[.36,.86],[.63,.82],[.84,.84]];pos.forEach((p,i)=>flowers.push({x:p[0]*W,y:p[1]*H,scale:.48+Math.random()*.4,phase:Math.random()*7,message:messages[i],label:words[i%words.length]}))}
function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function drawStarfield(time){ctx.clearRect(0,0,W,H);for(const s of stars){s.y-=s.s;if(s.y<0)s.y=H;ctx.globalAlpha=s.a*(.55+.45*Math.sin(time*.001+s.p));ctx.fillStyle=s.r>1.2?'#fff9c4':'#d69c15';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawGalaxy(time){let cx=W/2,cy=H*.48,base=Math.min(W,H),rot=time*.000035;glow(cx,cy,base*.44,'rgba(255,183,0,.07)');ctx.save();ctx.globalCompositeOperation='lighter';for(const p of dust){let spread=(Math.random()-.5)*.46,ang=p.arm*Math.PI*2/5+p.r*.018+spread+rot*(1.1-p.r/base),x=cx+Math.cos(ang)*p.r*1.25,y=cy+Math.sin(ang)*p.r*.39;ctx.globalAlpha=p.alpha*(1-p.r/(base*.62))*.75;ctx.fillStyle=p.r<base*.12?'#fff5ad':(p.r%3<1?'#ffe44b':'#bb7808');ctx.beginPath();ctx.arc(x,y,p.radius,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,218,47,.45)';ctx.lineWidth=1;ctx.save();ctx.translate(cx,cy);ctx.rotate(rot*.8);ctx.scale(1,.38);ctx.beginPath();ctx.arc(0,0,base*.31,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,base*.42,0,Math.PI*2);ctx.stroke();ctx.restore();glow(cx,cy,base*.16,'rgba(255,198,21,.22)')}
function drawHeart(time){let cx=W/2,cy=H*.31,scale=Math.min(W,H)*.006;ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<900;i++){let a=Math.random()*Math.PI*2,r=Math.random();let x=16*Math.pow(Math.sin(a),3),y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));x=cx+x*scale*(.62+r*.38);y=cy+y*scale*(.62+r*.38);let pulse=1+.04*Math.sin(time*.003+i);ctx.globalAlpha=.2+Math.random()*.65;ctx.fillStyle=i%5?'#ffdf13':'#fff8a0';ctx.beginPath();ctx.arc(x,y,Math.random()*1.7+.3,0,Math.PI*2);ctx.fill()}ctx.restore();glow(cx,cy,Math.min(W,H)*.18,'rgba(255,204,0,.08)')}
function drawFlower(f,time){let sway=Math.sin(time*.0012+f.phase)*5, x=f.x+sway,y=f.y+Math.sin(time*.001+f.phase)*3,r=27*f.scale;ctx.save();ctx.translate(x,y);ctx.globalCompositeOperation='lighter';for(let i=0;i<20;i++){let a=i*Math.PI*2/20;ctx.save();ctx.rotate(a);let g=ctx.createLinearGradient(0,-r*.2,0,-r*1.45);g.addColorStop(0,'#e69a00');g.addColorStop(.55,'#ffd72f');g.addColorStop(1,'#fff69b');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-r*.8,r*.23,r*.72,0,0,Math.PI*2);ctx.fill();ctx.restore()}let c=ctx.createRadialGradient(-r*.2,-r*.2,1,0,0,r*.48);c.addColorStop(0,'#c67b08');c.addColorStop(.45,'#5a2c02');c.addColorStop(1,'#180d02');ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,r*.48,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.75;ctx.fillStyle='#ffc51c';for(let i=0;i<18;i++){let a=i*2.4,rr=Math.sqrt(i/18)*r*.36;ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,r*.045,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore();f.renderX=x;f.renderY=y;f.hit= Math.max(28,r*1.5)}
function drawLabels(){ctx.save();ctx.font=`bold ${Math.max(9,Math.min(16,W*.012))}px Courier New`;ctx.textAlign='center';ctx.shadowColor='#ffbd00';ctx.shadowBlur=11;flowers.forEach((f,i)=>{ctx.fillStyle='#ffe96b';ctx.globalAlpha=.5+.4*Math.sin(performance.now()*.001+f.phase);ctx.fillText(f.label,f.renderX,f.renderY+f.hit+15)});ctx.restore();ctx.globalAlpha=1}
function animate(time){drawStarfield(time);drawGalaxy(time);drawHeart(time);flowers.forEach(f=>drawFlower(f,time));drawLabels();requestAnimationFrame(animate)}
function show(f){phrase.textContent=f.message;card.classList.add('open');clearTimeout(closeTimer);closeTimer=setTimeout(()=>card.classList.remove('open'),6500)}
canvas.addEventListener('click',e=>{let rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,hit=flowers.find(f=>Math.hypot(x-f.renderX,y-f.renderY)<f.hit);if(hit)show(hit)});addEventListener('resize',resize);resize();requestAnimationFrame(animate);
</script></body></html>
